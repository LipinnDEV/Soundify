spring:
  application:
    name: soundify-api
  config:
    # Permite rodar o backend fora do Docker lendo o arquivo .env da raiz do repositório (se existir).
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:soundify}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}"
    username: "${MYSQL_USER:soundify}"
    password: "${MYSQL_PASSWORD}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # o esquema é criado e versionado pelo Flyway (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d # capas e áudios de demonstração (static/media)

server:
  port: "${SERVER_PORT:8080}"
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    secret: "${JWT_SECRET:}" # obrigatório, mínimo de 32 caracteres (validado na inicialização)
    expiration-minutes: "${JWT_EXPIRATION_MINUTES:120}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}"
  history:
    min-listened-seconds: 3 # só registra no histórico depois de 3 s de reprodução real
    dedupe-window-seconds: 10 # ignora o mesmo registro repetido nessa janela

logging:
  level:
    root: INFO
    br.com.soundify: INFO
